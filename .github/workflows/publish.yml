# Publishes this n8n community node package to npm.
#
# A release is a pull request that bumps `version` in package.json and adds
# its changelog entry. Merging it is the whole ceremony: this workflow sees
# the new version on main, publishes it, and tags the commit.
#
# ─── AUTHENTICATION ────────────────────────────────────────────────────────────
#
# None stored. npm trusts this repository and this workflow file directly
# (Trusted Publishing, OIDC), so the runner mints a short-lived token per run
# and no secret sits in the repository settings. `id-token: write` below is
# what allows it, and it is also what signs the provenance attestation n8n has
# required of community nodes since 1 May 2026.
#
# Configured once on npmjs.com, under the package's Publish access → Trusted
# Publishers: owner CapSens, repository signlift-n8n, workflow publish.yml.
#
# ─── WHY NOT `npm run release` ─────────────────────────────────────────────────
#
# It wants to commit and push on main, which branch protection refuses. Its CI
# path does lint, build and `npm publish`, which the three steps below do
# explicitly — and RELEASE_MODE answers the `prepublishOnly` guard that exists
# to stop a bare `npm publish` from skipping exactly those.

name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token npm exchanges, and signs the provenance.
      id-token: write
      # Tags the released commit.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Read the declared version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The workflow runs on every push to main, most of which change no
      # version. Asking the registry is what makes it a no-op then, and what
      # makes a re-run of an already-published version harmless.
      - name: Check whether it is already published
        id: published
        run: |
          if npm view "n8n-nodes-signlift@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.value == 'false'
        run: 'npm ci'

      - name: Lint
        if: steps.published.outputs.value == 'false'
        run: 'npm run lint'

      - name: Build
        if: steps.published.outputs.value == 'false'
        run: 'npm run build'

      - name: Publish
        if: steps.published.outputs.value == 'false'
        run: 'npm publish --provenance'
        env:
          RELEASE_MODE: 'true'

      # After publishing, never before: a tag pointing at a version that
      # failed to publish would have to be moved by hand.
      - name: Tag the released commit
        if: steps.published.outputs.value == 'false'
        run: |
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"

      # The check n8n itself runs when a node is submitted for verification.
      # It reads the published tarball and its attestation, so it can only run
      # after the publish above — and after the tag, so that a scan failure
      # leaves a published version properly tagged rather than orphaned.
      #
      # The scanner exits 0 even when it reports a failure, so trusting its
      # status would make this step green no matter what. The success line is
      # the only reliable signal; do not simplify this back to a bare call.
      #
      # Retried because the registry does not always serve the attestation the
      # instant publish returns, and a fresh version is exactly the case here.
      - name: Scan the published package
        if: steps.published.outputs.value == 'false'
        env:
          SPEC: "n8n-nodes-signlift@${{ steps.version.outputs.value }}"
        run: |
          for attempt in 1 2 3 4 5; do
            npx --yes @n8n/scan-community-package "$SPEC" 2>&1 | tee scan.log || true

            if grep -q "has passed all security checks" scan.log; then
              echo "Scan passed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt did not pass; retrying."
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done

          echo "::error::$SPEC did not pass the n8n community package scan"
          exit 1
